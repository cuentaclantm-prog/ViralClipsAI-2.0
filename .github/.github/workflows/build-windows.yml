
name: Build ViralClipsAI for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar aplicación
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ViralClipsAI --collect-all yt_dlp --collect-all imageio_ffmpeg --collect-all faster_whisper --collect-all ctranslate2 --collect-all av app.py

      - name: Crear paquete ZIP
        run: |
          Compress-Archive -Path dist\ViralClipsAI -DestinationPath ViralClipsAI-Windows.zip

      - name: Publicar compilación
        uses: actions/upload-artifact@v4
        with:
          name: ViralClipsAI-Windows
          path: ViralClipsAI-Windows.zip

